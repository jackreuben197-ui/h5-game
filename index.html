<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Newpkr</title>
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <meta name="apple-mobile-web-app-title" content="Newpkr" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }

      /* Cocos 牌桌画布层：在最底层 */
      #GameCanvas {
        position: fixed;
        inset: 0;
        width: 100% !important;
        height: 100vh !important;
        height: 100dvh !important;
        z-index: 1;
      }

      /* H5 业务层：覆盖在 Cocos 之上 */
      #app {
        position: fixed;
        inset: 0;
        z-index: 10;
      }

      #drawCanvas {
        display: none;
      }

      #splash {
        display: none;
      }
      /* Cocos EditBox 原生输入框需要显示在 H5 业务层之上 */
      .cocosEditBox {
        z-index: 20 !important;
      }

    </style>
  </head>
  <body>
    <!-- Cocos 运行节点（与 build-templates/web-mobile 对齐） -->
    <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
    <canvas id="drawCanvas"></canvas>
    <div id="splash"></div>
    <input id="OpenImageFile" type="file" accept=".png,.jpg,.jpeg" style="visibility: hidden" />

    <!-- H5 挂载节点 -->
    <div id="app"></div>

    <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

    <!-- Cocos 启动脚本：按环境按需加载，避免 Telegram Mini App 场景被 Cocos 加载流程阻塞 -->
    <script type="text/javascript">
      ;(function () {
        function parseBooleanFlag(value) {
          if (value === '1' || value === 'true') {
            return true
          }
          if (value === '0' || value === 'false') {
            return false
          }
          return null
        }

        function isTelegramMiniAppEnv() {
          if (window.Telegram && window.Telegram.WebApp) {
            return true
          }

          // Telegram WebApp 常见注入参数：可能在 search/hash 中出现。
          var tgPattern = /tgWebApp(Data|Version|Platform|ThemeParams)=/i
          return tgPattern.test(window.location.search) || tgPattern.test(window.location.hash)
        }

        function loadScript(moduleName, cb, onError) {
          function scriptLoaded() {
            domScript.removeEventListener('load', scriptLoaded, false)
            domScript.removeEventListener('error', scriptError, false)
            document.body.removeChild(domScript)
            cb && cb()
          }

          function scriptError() {
            domScript.removeEventListener('load', scriptLoaded, false)
            domScript.removeEventListener('error', scriptError, false)
            document.body.removeChild(domScript)
            onError && onError()
          }

          var domScript = document.createElement('script')
          domScript.async = true
          domScript.src = moduleName
          domScript.addEventListener('load', scriptLoaded, false)
          domScript.addEventListener('error', scriptError, false)
          document.body.appendChild(domScript)
        }

        var searchParams = new URLSearchParams(window.location.search)
        var cocosFlag = parseBooleanFlag(searchParams.get('cocos'))
        var disableCocosByEnv = isTelegramMiniAppEnv()
        var shouldEnableCocos = cocosFlag !== null ? cocosFlag : !disableCocosByEnv
        window.__ENABLE_COCOS__ = shouldEnableCocos

        if (!shouldEnableCocos) {
          var gameCanvas = document.getElementById('GameCanvas')
          if (gameCanvas) {
            gameCanvas.style.display = 'none'
          }
          return
        }

        // 可选调试脚本，不存在时不影响后续流程。
        loadScript('vconsole.min.js')

        var splash = document.getElementById('splash')
        if (splash) {
          splash.style.display = 'block'
        }

        function hideSplash() {
          if (splash) {
            splash.style.display = 'none'
          }
        }

        loadScript(
          'src/settings.js',
          function () {
            loadScript(
              'main.js',
              function () {
                if (!window._CCSettings) {
                  hideSplash()
                  return
                }

                var debug = window._CCSettings.debug
                loadScript(
                  debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js',
                  function () {
                    var hasPhysics = window.CC_PHYSICS_BUILTIN || window.CC_PHYSICS_CANNON
                    if (hasPhysics) {
                      loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot, hideSplash)
                    } else if (typeof window.boot === 'function') {
                      window.boot()
                    } else {
                      hideSplash()
                    }
                  },
                  hideSplash,
                )
              },
              hideSplash,
            )
          },
          hideSplash,
        )
      })()
    </script>

    <!-- Telegram 初始化（异步按需加载，网络不可达时不阻塞页面） -->
    <script>
      ;(function () {
        function initTelegramWebApp() {
          if (!window.Telegram || !window.Telegram.WebApp) {
            return
          }
          var tg = window.Telegram.WebApp
          tg.ready()
          if (typeof tg.expand === 'function') {
            tg.expand()
          }
        }

        // 先尝试直接初始化（例如容器已注入 Telegram 对象）。
        initTelegramWebApp()

        // 再异步加载官方 SDK，避免 head 同步脚本在弱网/不可达场景卡住首屏。
        var script = document.createElement('script')
        script.src = 'https://telegram.org/js/telegram-web-app.js'
        script.async = true
        script.defer = true
        script.crossOrigin = 'anonymous'
        script.referrerPolicy = 'no-referrer'
        script.onload = initTelegramWebApp
        script.onerror = function () {
          console.warn('[telegram] sdk load failed, continue without telegram bridge')
        }
        document.head.appendChild(script)
      })()
    </script>

    <!-- H5 独立入口：可被 Cocos 统一模板复用 -->
    <script type="module" src="/src/entry/cocos-h5-entry.ts"></script>
  </body>
</html>
