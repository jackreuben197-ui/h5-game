    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=overlays-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Telegram SDK 必须在业务脚本前读取原始启动参数；普通浏览器不加载，避免阻塞首屏。 -->
    <script>
      ;(function () {
        if (window.Telegram && window.Telegram.WebApp) {
          return
        }

        var locationText = String(window.location.search || '') + String(window.location.hash || '')
        if (!/(?:[?#&]|^)tgWebAppData=/.test(locationText)) {
          return
        }

        document.write('<script src="https://telegram.org/js/telegram-web-app.js?63"><\/script>')
      })()
    </script>

    <!-- 主题首帧防闪烁：在样式生效前设好 html[data-theme]，
         正式逻辑（持久化/系统主题监听/meta 同步）由 src/utils/theme.ts 接管，
         默认值与 utils/theme.ts 的 DEFAULT_THEME_MODE 保持同步 -->
    <script>
      ;(function () {
        var mode = ''
        try {
          // localStore 统一 JSON 序列化存储，这里按同规则直读。
          mode = JSON.parse(window.localStorage.getItem('dzpk_h5_THEME_MODE') || '""')
        } catch (error) {}
        // URL ?theme=light|dark|system 预览覆盖（hash 路由下 query 可能在 hash 段内）。
        var match = (window.location.search + ' ' + window.location.hash).match(
          /[?&]theme=(light|dark|system)\b/,
        )
        if (match) {
          mode = match[1]
        }
        if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
          mode = 'system' // DEFAULT_THEME_MODE：默认跟随当前设备 / 浏览器 / WebView 环境
        }
        var theme = mode
        if (mode === 'system') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <!-- @silenthill/h5-cc-i18n runtime: 必须先于 Vue 入口加载，挂 window.__H5_CC_I18N__ -->
    <script src="./h5-cc-i18n.min.js"></script>
    <!-- 语言首帧对齐：Vue 入口与 Cocos 启动都读取该实例，先按持久化语言设好 locale -->
    <script>
      ;(function () {
        var raw = window.localStorage.getItem('dzpk_h5_Language') || ''
        var saved = raw
        try {
          saved = JSON.parse(raw)
        } catch (error) {}
        var LOCALE_MAP = {
          cn: 'zh-CN',
          zh: 'zh-TW',
          en: 'en',
          pt: 'pt',
          de: 'de',
          es: 'es',
          fr: 'fr',
          hi: 'hi',
          it: 'it',
          ja: 'ja',
          ko: 'ko',
          ru: 'ru',
          th: 'th',
          vi: 'vi',
        }
        var target = LOCALE_MAP[saved]
        var runtime = window.__H5_CC_I18N__
        if (target && runtime && typeof runtime.setLocale === 'function') {
          runtime.setLocale(target)
        }
      })()
    </script>
    <script>
      ;(function () {
        var root = document.documentElement
        var lastViewportSignature = ''

        function isIosStandalone() {
          var nav = window.navigator || {}
          var ua = String(nav.userAgent || '')
          var isIos = /iPad|iPhone|iPod/.test(ua)
            || (nav.platform === 'MacIntel' && Number(nav.maxTouchPoints) > 1)
          var isStandalone = nav.standalone === true
            || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)

          return isIos && isStandalone
        }

        if (isIosStandalone()) {
          root.setAttribute('data-ios-standalone', '1')
        }

        function toPixelNumber(value) {
          var next = parseFloat(String(value || '0'))
          if (!isFinite(next) || next < 0) {
            return 0
          }
          return Math.round(next)
        }

        function readSafeAreaTopFromCss() {
          if (!document.body || typeof window.getComputedStyle !== 'function') {
            return 0
          }

          var probe = document.createElement('div')
          probe.style.position = 'fixed'
          probe.style.top = '0'
          probe.style.left = '0'
          probe.style.width = '0'
          probe.style.height = '0'
          probe.style.paddingTop = 'env(safe-area-inset-top)'
          probe.style.visibility = 'hidden'
          probe.style.pointerEvents = 'none'
          document.body.appendChild(probe)
          var safeTop = toPixelNumber(window.getComputedStyle(probe).paddingTop)
          document.body.removeChild(probe)
          return safeTop
        }

        function syncStandaloneSafeArea() {
          if (!isIosStandalone()) {
            return
          }

          var safeTop = readSafeAreaTopFromCss()
          root.style.setProperty('--app-visual-safe-area-top', safeTop + 'px')
          window.__H5_SAFE_AREA_TOP__ = safeTop
        }

        function syncStandaloneSafeAreaWhenReady() {
          if (document.body) {
            syncStandaloneSafeArea()
            window.setTimeout(syncStandaloneSafeArea, 250)
            window.setTimeout(syncStandaloneSafeArea, 1000)
            return
          }
          document.addEventListener('DOMContentLoaded', syncStandaloneSafeAreaWhenReady, { once: true })
        }

        function getViewportHeight() {
          var innerHeight = Number(window.innerHeight) || 0
          var visualViewportHeight = window.visualViewport
            ? Number(window.visualViewport.height) || 0
            : 0
          var screenHeight = window.screen ? Number(window.screen.height) || 0 : 0

          if (isIosStandalone() && screenHeight > 0) {
            return Math.round(screenHeight) + 'px'
          }

          var height = Math.max(innerHeight, visualViewportHeight)
          return height > 0 ? Math.round(height) + 'px' : '100vh'
        }

        function syncViewportHeight() {
          // 软键盘弹出期间冻结视口 CSS 变量：Android 键盘会压缩 innerHeight，
          // 若跟着更新 --app-viewport-height / --app-cocos-height，Cocos canvas 会被压扁。
          if (window.__H5_KEYBOARD_OPEN__ || window.__H5_KEYBOARD_CLOSING__) {
            return
          }
          var height = getViewportHeight()
          var viewportWidth = Number(window.visualViewport && window.visualViewport.width)
            || Number(window.innerWidth)
            || 375
          var mainLayout = root.getAttribute('data-main-layout') || ''
          var cocosActive = root.getAttribute('data-cocos-active') === '1'
          var adaptiveDesktop = Boolean(mainLayout || cocosActive) && viewportWidth >= 600
          var frameWidth = adaptiveDesktop ? viewportWidth : Math.min(viewportWidth, 480)
          // 桌面横向缩放时 frame 高度不变，宽度由 CSS 100vw 自行处理；不重复写高度变量。
          var widthSignature = adaptiveDesktop ? 'desktop' : String(Math.round(frameWidth))
          var viewportSignature = widthSignature + 'x' + height + 'x'
            + mainLayout + 'x' + String(cocosActive)
          if (viewportSignature === lastViewportSignature) {
            return
          }
          lastViewportSignature = viewportSignature
          root.style.setProperty('--app-viewport-height', height)

          // 画布始终占满浏览器可视区，桌面端也不裁剪成手机框。
          var heightNumber = parseFloat(height)
          if (isFinite(heightNumber) && heightNumber > 0) {
            var frameHeight = heightNumber
            root.style.removeProperty('--app-frame-width')
            root.style.setProperty(
              '--app-frame-height',
              Math.round(frameHeight) + 'px',
            )
            root.style.setProperty(
              '--app-frame-offset-top',
              Math.max(0, Math.round((heightNumber - frameHeight) / 2)) + 'px',
            )
          }
        }

        function syncViewportHeightLater() {
          syncViewportHeight()
          syncStandaloneSafeArea()
          window.setTimeout(syncViewportHeight, 250)
          window.setTimeout(syncViewportHeight, 1000)
          window.setTimeout(syncStandaloneSafeArea, 250)
          window.setTimeout(syncStandaloneSafeArea, 1000)
        }

        syncViewportHeight()
        syncStandaloneSafeAreaWhenReady()
        window.addEventListener('resize', function () {
          syncViewportHeight()
          syncStandaloneSafeArea()
        }, { passive: true })
        window.addEventListener('orientationchange', syncViewportHeightLater, { passive: true })
        window.addEventListener('h5:cocos-layout-change', syncViewportHeightLater)
        document.addEventListener('visibilitychange', function () {
          syncViewportHeight()
          syncStandaloneSafeArea()
        }, { passive: true })
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', function () {
            syncViewportHeight()
            syncStandaloneSafeArea()
          }, { passive: true })
        }

        // ---- 通用软键盘适配（普通浏览器与 PWA 使用同一套覆盖式行为）----
        // 牌桌和 H5 外壳始终保留键盘弹出前的逻辑尺寸；键盘只遮盖页面。
        // Cocos EditBox 聚焦时平移 #GameDiv，H5 客服输入框聚焦时抬升 chat-overlay。
        // 这样不会触发 FIXED_WIDTH/FIXED_HEIGHT 来回切换，也不会产生可滚动的灰色空白。
        function isTextInput(el) {
          if (!el || !el.tagName) return false
          var tag = el.tagName
          if (tag === 'TEXTAREA' || el.isContentEditable === true) return true
          if (tag !== 'INPUT') return false
          var type = String(el.type || 'text').toLowerCase()
          return type === 'text'
            || type === 'search'
            || type === 'email'
            || type === 'url'
            || type === 'tel'
            || type === 'password'
            || type === 'number'
        }

        function isCocosEditBoxInput(el) {
          return !!(el && el.classList && el.classList.contains('cocosEditBox'))
        }

        var keyboardCloseTimer = 0
        var keyboardRestoreTimers = []
        var keyboardFocusIsCocos = false
        var keyboardStableHeight = 0
        var cocosKeyboardOffset = 0
        var h5KeyboardOffset = 0

        function getCssPixel(name) {
          if (typeof window.getComputedStyle !== 'function') return 0
          return toPixelNumber(window.getComputedStyle(root).getPropertyValue(name))
        }

        function getStableViewportSize() {
          var canvas = document.getElementById('GameCanvas')
          var rect = canvas && typeof canvas.getBoundingClientRect === 'function'
            ? canvas.getBoundingClientRect()
            : null
          var width = Math.round(
            (rect && rect.width)
              || Number(window.innerWidth)
              || Number(root.clientWidth)
              || 0,
          )
          var height = Math.round(
            getCssPixel('--app-cocos-height')
              || (rect && rect.height)
              || Number(window.innerHeight)
              || Number(root.clientHeight)
              || 0,
          )
          return { width: width, height: height }
        }

        function setKeyboardOffset(name, value) {
          root.style.setProperty(name, Math.max(0, Math.round(value || 0)) + 'px')
        }

        function clearKeyboardRestoreTimers() {
          while (keyboardRestoreTimers.length) {
            window.clearTimeout(keyboardRestoreTimers.pop())
          }
        }

        function enableOverlayKeyboard() {
          try {
            if (window.navigator && window.navigator.virtualKeyboard) {
              window.navigator.virtualKeyboard.overlaysContent = true
            }
          } catch (error) {}
        }

        // 必须在 input 真正 focus 前启用；Cocos 侧 editing-did-began 也会调用此入口。
        window.__H5_PREPARE_KEYBOARD__ = enableOverlayKeyboard
        enableOverlayKeyboard()

        function getKeyboardMetrics() {
          var stableHeight = keyboardStableHeight || getStableViewportSize().height
          var visibleTop = 0
          var visibleBottom = stableHeight
          var virtualKeyboard = window.navigator && window.navigator.virtualKeyboard
          var keyboardRect = virtualKeyboard && virtualKeyboard.boundingRect

          if (keyboardRect && Number(keyboardRect.height) > 0) {
            visibleBottom = Math.min(stableHeight, Math.max(0, Number(keyboardRect.y) || 0))
          } else if (window.visualViewport) {
            visibleTop = Math.max(0, Number(window.visualViewport.offsetTop) || 0)
            visibleBottom = Math.min(
              stableHeight,
              visibleTop + Math.max(0, Number(window.visualViewport.height) || 0),
            )
          } else if (Number(window.innerHeight) > 0) {
            visibleBottom = Math.min(stableHeight, Number(window.innerHeight))
          }

          return {
            stableHeight: stableHeight,
            visibleTop: visibleTop,
            visibleBottom: visibleBottom,
            inset: Math.max(0, stableHeight - visibleBottom),
          }
        }

        function resetBrowserScroll() {
          if (window.scrollX !== 0 || window.scrollY !== 0) {
            window.scrollTo(0, 0)
          }
        }

        function updateKeyboardLayout() {
          if (!window.__H5_KEYBOARD_OPEN__) return
          var metrics = getKeyboardMetrics()
          var active = document.activeElement
          setKeyboardOffset('--app-keyboard-inset', metrics.inset)

          if (keyboardFocusIsCocos) {
            // rect 已包含上一次的父容器 transform，先加回旧 offset 得到未平移位置。
            var cocosRect = active && typeof active.getBoundingClientRect === 'function'
              ? active.getBoundingClientRect()
              : null
            var originalBottom = cocosRect ? cocosRect.bottom + cocosKeyboardOffset : 0
            cocosKeyboardOffset = originalBottom > 0
              ? Math.max(0, originalBottom - metrics.visibleBottom + 12)
              : Math.max(0, metrics.inset)
            setKeyboardOffset('--app-cocos-keyboard-offset', cocosKeyboardOffset)
            setKeyboardOffset('--app-h5-keyboard-offset', 0)
          } else if (active && active.closest && active.closest('.chat-overlay')) {
            // 客服面板自身使用 --app-keyboard-inset 抬升，不再平移整个 H5。
            h5KeyboardOffset = 0
            setKeyboardOffset('--app-h5-keyboard-offset', 0)
          } else {
            // 其他 H5 文本框只在被遮挡时平移外壳，行为等同浏览器正常的输入框上顶。
            var activeRect = active && typeof active.getBoundingClientRect === 'function'
              ? active.getBoundingClientRect()
              : null
            var originalH5Bottom = activeRect ? activeRect.bottom + h5KeyboardOffset : 0
            h5KeyboardOffset = originalH5Bottom > 0
              ? Math.max(0, originalH5Bottom - metrics.visibleBottom + 12)
              : 0
            setKeyboardOffset('--app-h5-keyboard-offset', h5KeyboardOffset)
            setKeyboardOffset('--app-cocos-keyboard-offset', 0)
          }

          // Cocos 2.4.8 Android EditBox 会在 800ms 后主动 scrollIntoView。
          // 持续把页面滚动归零，真正的可见性由上面的容器平移保证。
          resetBrowserScroll()
          window.requestAnimationFrame(resetBrowserScroll)
        }

        function rememberStableViewport() {
          var size = getStableViewportSize()
          if (size.height > 0) keyboardStableHeight = size.height
          if (keyboardStableHeight > 0) {
            root.style.setProperty('--app-viewport-height', keyboardStableHeight + 'px')
          }
        }

        function openKeyboardFix(target) {
          window.clearTimeout(keyboardCloseTimer)
          clearKeyboardRestoreTimers()
          enableOverlayKeyboard()
          if (!window.__H5_KEYBOARD_OPEN__) {
            rememberStableViewport()
          }
          window.__H5_KEYBOARD_CLOSING__ = false
          keyboardFocusIsCocos = isCocosEditBoxInput(target)
          window.__H5_KEYBOARD_OPEN__ = true
          root.setAttribute('data-keyboard-open', '1')
          root.setAttribute('data-keyboard-owner', keyboardFocusIsCocos ? 'cocos' : 'h5')
          updateKeyboardLayout()
          window.requestAnimationFrame(updateKeyboardLayout)
          keyboardRestoreTimers.push(window.setTimeout(updateKeyboardLayout, 80))
          keyboardRestoreTimers.push(window.setTimeout(updateKeyboardLayout, 250))
          keyboardRestoreTimers.push(window.setTimeout(updateKeyboardLayout, 850))
        }

        function viewportHasRecovered() {
          if (!keyboardStableHeight) return true
          var currentHeight = Math.max(
            Number(window.innerHeight) || 0,
            Number(window.visualViewport && window.visualViewport.height) || 0,
          )
          return currentHeight >= keyboardStableHeight - 48
        }

        function finishKeyboardRestore(force) {
          if (window.__H5_KEYBOARD_OPEN__) return
          if (!force && !viewportHasRecovered()) return
          window.__H5_KEYBOARD_CLOSING__ = false
          keyboardStableHeight = 0
          lastViewportSignature = ''
          syncViewportHeight()
          syncStandaloneSafeArea()
          resetBrowserScroll()
          if (typeof window.__H5_FORCE_COCOS_REFIT__ === 'function') {
            window.__H5_FORCE_COCOS_REFIT__()
          }
          window.dispatchEvent(new Event('h5:viewport-stable'))
        }

        function closeKeyboardFix() {
          window.__H5_KEYBOARD_OPEN__ = false
          window.__H5_KEYBOARD_CLOSING__ = true
          keyboardFocusIsCocos = false
          cocosKeyboardOffset = 0
          h5KeyboardOffset = 0
          root.removeAttribute('data-keyboard-open')
          root.removeAttribute('data-keyboard-owner')
          setKeyboardOffset('--app-keyboard-inset', 0)
          setKeyboardOffset('--app-cocos-keyboard-offset', 0)
          setKeyboardOffset('--app-h5-keyboard-offset', 0)
          resetBrowserScroll()
          clearKeyboardRestoreTimers()
          ;[50, 180, 350, 700].forEach(function (delay) {
            keyboardRestoreTimers.push(window.setTimeout(function () {
              finishKeyboardRestore(false)
            }, delay))
          })
          keyboardRestoreTimers.push(window.setTimeout(function () {
            finishKeyboardRestore(true)
          }, 1200))
        }

        document.addEventListener('pointerdown', function (event) {
          if (isTextInput(event.target)) {
            enableOverlayKeyboard()
          }
        }, true)

        document.addEventListener('focusin', function (event) {
          if (isTextInput(event.target)) {
            openKeyboardFix(event.target)
          }
        })

        document.addEventListener('focusout', function (event) {
          if (!isTextInput(event.target)) return
          window.clearTimeout(keyboardCloseTimer)
          keyboardCloseTimer = window.setTimeout(function () {
            if (isTextInput(document.activeElement)) {
              openKeyboardFix(document.activeElement)
              return
            }
            closeKeyboardFix()
          }, 200)
        })

        function bindKeyboardGeometryEvents() {
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateKeyboardLayout, { passive: true })
            window.visualViewport.addEventListener('scroll', updateKeyboardLayout, { passive: true })
          }
          var virtualKeyboard = window.navigator && window.navigator.virtualKeyboard
          if (virtualKeyboard && virtualKeyboard.addEventListener) {
            virtualKeyboard.addEventListener('geometrychange', updateKeyboardLayout)
          }
          window.addEventListener('resize', updateKeyboardLayout, { passive: true })
          window.addEventListener('scroll', function () {
            if (!window.__H5_KEYBOARD_OPEN__) return
            resetBrowserScroll()
            updateKeyboardLayout()
          }, { passive: true })
        }

        bindKeyboardGeometryEvents()
      })()
    </script>

    <style>
      :root {
        --app-frame-max-width: 100%;
        --app-frame-width: min(100%, var(--app-frame-max-width));
        --app-viewport-height: 100vh;
        --app-frame-height: var(--app-viewport-height);
        --app-frame-offset-top: 0px;
        --app-full-height: var(--app-viewport-height);
        /* Cocos 以此为真实画框高度，不含 H5 的底部溢出量。 */
        --app-cocos-height: var(--app-viewport-height);
        --app-bottom-bleed: 0px;
        --app-content-safe-area-top: env(safe-area-inset-top);
        --app-visual-safe-area-top: 0px;
        --app-tg-guard-top: 0px;
        --app-viewport-safe-area-top: env(safe-area-inset-top);
        /* 软键盘只改变下面三个位移值，不改变 Cocos 的逻辑画布尺寸。 */
        --app-keyboard-inset: 0px;
        --app-cocos-keyboard-offset: 0px;
        --app-h5-keyboard-offset: 0px;
      }

      @supports (height: 100dvh) {
        :root {
          --app-viewport-height: 100dvh;
        }
      }

      html[data-ios-standalone='1'] {
        --app-full-height: var(--app-viewport-height);
        --app-cocos-height: var(--app-viewport-height);
        --app-bottom-bleed: max(env(safe-area-inset-bottom), 120px);
        /* 主屏模式下让 H5 控件保持在 iOS 状态栏之下。 */
        --app-content-safe-area-top: env(safe-area-inset-top);
      }

      /* Telegram Mini App：顶部安全区拆成两段，避免与 #app > * 的 guard padding 二次叠加。 */
      html[data-tg-mini-app='1'] {
        /* 顶部总留白，也是绕过 guard 的元素（body teleport 弹层、自行覆盖根节点 padding
           的页面）直接消费的值。SDK 未回调（非全屏 / 尚未就绪）时 --tg-safe-area-guard-top
           为 0，以 env() 兜底，避免出现内容贴顶的空窗。 */
        --app-viewport-safe-area-top: max(
          env(safe-area-inset-top),
          var(--tg-safe-area-guard-top, 0px)
        );
        --app-tg-guard-top: max(
          0px,
          min(
            env(safe-area-inset-top),
            calc(var(--tg-content-safe-area-inset-top, 0px) - var(--app-top-padding, 0px)),
            calc(var(--app-viewport-safe-area-top) - var(--app-top-padding, 0px))
          )
        );
        /* 全屏 Mini App 的关闭/展开按钮浮在内容上，guard padding 只补到内容安全区之内，
           余下的高度交给 --app-content-safe-area-top，由各页头部自行消费。 */
        --app-content-safe-area-top: max(
          0px,
          calc(var(--app-viewport-safe-area-top) - var(--app-tg-guard-top))
        );
      }

      html {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        min-height: -webkit-fill-available;
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #000;
      }

      body {
        margin: 0 auto;
        width: var(--app-frame-width);
        max-width: var(--app-frame-max-width);
        height: 100vh;
        height: 100dvh;
        height: var(--app-full-height);
        min-height: 100%;
        min-height: -webkit-fill-available;
        overflow: hidden;
        overscroll-behavior: none;
        position: relative;
        background-color: #000;
        background-image: var(--h5-main-bg-image, none);
        background-repeat: no-repeat;
        background-position: center top;
        background-size: cover;
      }

      /*
       * 宽屏下保持移动端 H5/Cocos 坐标系。transform 让 body 成为
       * position:fixed 页面与弹窗（含挂到 body 的 Vue teleport）的包含块。
       */
      @media (min-width: 481px) {
        :root,
        html[data-ios-standalone='1'] {

        }

      }

        top: 0;
        left: 0;
        right: 0;

        left: 0;
        right: auto;

        z-index: 0;

      }

        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: calc(-1 * var(--app-bottom-bleed));
        width: 100%;
        height: auto;
        min-height: 0;
        z-index: 10;
        box-sizing: border-box;
        background-color: #fff;
        background-image: var(--h5-main-bg-image, none);
        background-repeat: no-repeat;
        background-position: center top; /* 确保背景图从绝对顶部开始对齐 */
        background-size: cover;          /* 或者设置 100% 100% 铺满 */
      }

        transform: translate3d(0, calc(-1 * var(--app-h5-keyboard-offset)), 0);
      }

      html[data-ios-standalone='1'] #app {
        height: auto;
        min-height: 0;
      }

      }

      /* 0901 起 App.vue 用 .h5-route-host 包住 RouterView：guard 必须继续落在页面
         根节点上，否则包裹层的 padding 会和页面自身的整屏高度叠加出一屏滚动。 */

      }

      }

            rootStyle.setProperty('--tg-safe-area-inset-right', safeRight + 'px')

            rootStyle.setProperty('--tg-content-safe-area-inset-bottom', contentBottom + 'px')
            rootStyle.setProperty('--tg-content-safe-area-inset-left', contentLeft + 'px')
            rootStyle.setProperty('--tg-content-safe-area-inset-right', contentRight + 'px')

          //   viewportChanged + isKeyboardOpen 的判断在键盘收起时会因 vv 滞后误判（vvH=476 innerH=812），
          //   导致走了"键盘弹出"分支，收起后画面无法恢复。focusin/focusout 由 DOM 焦点驱动，不滞后。

            if (tag === 'INPUT' || tag === 'TEXTAREA') {

            }
          })

          document.addEventListener('focusout', function(e) {
            var tag = e.target.tagName
            if (tag !== 'INPUT' && tag !== 'TEXTAREA') return
            // 延迟恢复（防焦点切换误触发，比如从 input 切到另一个 input）
            setTimeout(function() {
              var active = document.activeElement
              if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
                return
              }
              deactivateFix('focusout')
            }, 200)
          })

          // 兜底：viewportChanged（只用于保持锁定，不用于激活）
          // ⚠️ 不在 viewportChanged 里 activateFix —— 键盘收起时 vv 滞后会导致 isKeyboardOpen 误判，
          //    再次激活 fix → emit('canvas-resize') → Widget 对齐错乱 → 按钮点击失效。
          //    激活完全由 focusin 负责（最可靠的 DOM 焦点信号）。
          tg.onEvent('viewportChanged', function() {
            if (isFixActive) {
              // fix 已激活（focusin 触发），保持 CSS 锁定
              canvas.style.setProperty('height', stableHeight + 'px', 'important')
            }
            // fix 未激活时不做任何事
          })
        }

        function syncTelegramHeaderAndBackground(tg) {
          var fill = getSafeFillColor(tg)
          if (document && document.documentElement) {
            document.documentElement.style.setProperty('--tg-safe-fill-bg', fill)
          }

          if (typeof tg.setBackgroundColor === 'function') {
            tg.setBackgroundColor(fill)
          }
          if (typeof tg.setHeaderColor === 'function') {
            tg.setHeaderColor(fill)
          }
        }

        // Mini App 判定的唯一入口：URL 与 SDK 任一给出 initData 都要落到 <html> 上，
        // data-tg-mini-app 是全部 Telegram 安全区 CSS 的开关，漏挂等于整套适配失效。
        var TG_MINI_APP_SESSION_KEY = '__H5_TG_MINI_APP__'
        // 与 utils/channelPackage.ts 的 TG_MINI_APP_PARAM 保持一致：跨 origin 跳转时
        // sessionStorage 不跟着走，Telegram 身份靠这个参数传递。
        var TG_MINI_APP_PARAM = 'tg_mini_app'

        function enableTelegramMiniAppMode() {
          window.__H5_TG_MINI_APP__ = true
          if (document && document.documentElement) {
            document.documentElement.setAttribute('data-tg-mini-app', '1')
          }
          // 页面重载后 tgWebAppData 已不在地址里，靠会话标记保住 Mini App 模式。
          // localStorage 兜底：copyStorageToMainDomain 会清空并换 origin，
          // sessionStorage 未必存活，重载时 WebView 也可能已丢会话。
          try {
            window.sessionStorage.setItem(TG_MINI_APP_SESSION_KEY, '1')
          } catch (error) {}
          try {
            window.localStorage.setItem(TG_MINI_APP_SESSION_KEY, '1')
          } catch (error) {}
        }

        function markTelegramMiniApp(initData) {
          var value = String(initData || '').trim()
          if (!value) {
            return false
          }
          window.__H5_TG_INIT_DATA__ = window.__H5_TG_INIT_DATA__ || value
          enableTelegramMiniAppMode()
          return true
        }

        function restoreTelegramMiniAppMode() {
          try {
            if (window.sessionStorage.getItem(TG_MINI_APP_SESSION_KEY) === '1') {
              enableTelegramMiniAppMode()
              return true
            }
          } catch (error) {}
          try {
            if (window.localStorage.getItem(TG_MINI_APP_SESSION_KEY) === '1') {
              enableTelegramMiniAppMode()
              return true
            }
          } catch (error) {}
          return false
        }

        // 全屏是异步授予的：requestFullscreen 只是请求，结果由 fullscreenChanged /
        // fullscreenFailed 回报。瞬时失败值得重试，UNSUPPORTED 则重试无意义。
        var FULLSCREEN_MAX_RETRY = 5
        var fullscreenRetryCount = 0
        var fullscreenRetryTimer = 0
        var fullscreenUnsupported = false

        function requestTelegramFullscreen(tg) {
          if (fullscreenUnsupported) {
            return false
          }
          if (typeof tg.requestFullscreen !== 'function') {
            fullscreenUnsupported = true
            console.warn('[telegram] requestFullscreen is unsupported, staying expanded')
            return false
          }
          if (tg.isFullscreen) {
            return true
          }
          try {
            tg.requestFullscreen()
            return true
          } catch (error) {
            console.warn('[telegram] requestFullscreen threw, falling back to expand:', error)
            if (typeof tg.expand === 'function') {
              tg.expand()
            }
            return false
          }
        }

        function scheduleFullscreenRetry(tg) {
          if (fullscreenUnsupported || fullscreenRetryCount >= FULLSCREEN_MAX_RETRY) {
            return
          }
          fullscreenRetryCount += 1
          window.clearTimeout(fullscreenRetryTimer)
          fullscreenRetryTimer = window.setTimeout(function () {
            requestTelegramFullscreen(tg)
          }, 300 * fullscreenRetryCount)
        }

        // 键盘修复按 screen.height 锁死 canvas，只有真正全屏时该基准才成立，
        // 半屏 sheet 里套用会把牌桌压变形。
        var keyboardFixBound = false

        function ensureTelegramKeyboardFix(tg) {
          if (keyboardFixBound || !tg.isFullscreen) {
            return
          }
          keyboardFixBound = true
          setupTelegramKeyboardFix(tg)
        }

        function bindFullscreenEvents(tg) {
          if (window.__H5_TG_FULLSCREEN_BOUND__ || typeof tg.onEvent !== 'function') {
            return
          }
          window.__H5_TG_FULLSCREEN_BOUND__ = true

          tg.onEvent('fullscreenFailed', function (payload) {
            var reason = String((payload && payload.error) || '')
            console.warn('[telegram] fullscreen request failed:', reason)
            if (reason === 'ALREADY_FULLSCREEN') {
              return
            }
            if (reason === 'UNSUPPORTED') {
              fullscreenUnsupported = true
              return
            }
            scheduleFullscreenRetry(tg)
          })

          tg.onEvent('fullscreenChanged', function () {
            if (tg.isFullscreen) {
              fullscreenRetryCount = 0
              window.clearTimeout(fullscreenRetryTimer)
              ensureTelegramKeyboardFix(tg)
            }
          })

          // 从后台回到前台后重新拿全屏：Telegram 可能在最小化 / 恢复时把窗口退回 sheet。
          tg.onEvent('activated', function () {
            requestTelegramFullscreen(tg)
          })
        }

        function initTelegramWebApp() {
          if (!window.Telegram || !window.Telegram.WebApp) {
            console.warn('[telegram] sdk loaded but Telegram.WebApp is not available, continue without telegram bridge')
            return
          }else{
            console.log('[telegram] sdk loaded and Telegram.WebApp is available, initializing telegram bridge')
          }

          var tg = window.Telegram.WebApp
          // telegram-web-app.js 在任意浏览器都会加载成功，Telegram.WebApp 的存在并不代表运行在
          // Mini App 内；只有非空 initData 才是真实标识。这里不提前 return——即使 initData 为空
          // （桌面端 / 二次打开 / 被截断的启动参数），全屏与安全区初始化仍要照常执行。
          var initData = String(tg.initData || '').trim()
          // SDK 的 initData 是后端校验签名的原文，优先级高于从 URL 解析出来的副本。
          if (initData) {
            window.__H5_TG_INIT_DATA__ = initData
          }
          markTelegramMiniApp(initData || window.__H5_TG_INIT_DATA__)

          // 通知运行时 Telegram 主题信息已可用；theme.ts 会优先读取 WebApp.colorScheme。
          window.dispatchEvent(new Event('h5:telegram-ready'))

          tg.ready()
          // 先 expand：全屏请求是异步的，且老客户端可能完全不支持，
          // 至少保证不停留在半屏的 bottom sheet 里。
          if (typeof tg.expand === 'function') {
            tg.expand()
          }
          requestTelegramFullscreen(tg)
          bindFullscreenEvents(tg)

          if (typeof tg.disableVerticalSwipes === 'function') {
            tg.disableVerticalSwipes()
          }
          if (typeof tg.enableClosingConfirmation === 'function') {
            tg.enableClosingConfirmation()
          }
          if (typeof tg.lockOrientation === 'function') {
            tg.lockOrientation()
          }

          // 安全区照常初始化：非全屏时 getTopControlsCompensation 返回 0，写入的值本就为空档；
          // 而全屏是异步生效的，若此处提前 return，fullscreenChanged 将无人监听，
          // 真正进入全屏后顶部安全区永远不会重算。
          applySafeAreaToCss(tg)
          bindSafeAreaEvents(tg)
          ensureTelegramKeyboardFix(tg)
          syncTelegramHeaderAndBackground(tg)

          window.setTimeout(function () {
            applySafeAreaToCss(tg)
          }, 200)
          window.setTimeout(function () {
            applySafeAreaToCss(tg)
          }, 1000)
        }

        function initH5TelegramEnvironment() {
          restoreTelegramMiniAppMode()
          if (readUrlParamFromLocation(TG_MINI_APP_PARAM) === '1') {
            enableTelegramMiniAppMode()
          }
          markTelegramMiniApp(readTelegramInitDataFromLocation())

          // 同 initTelegramWebApp：仅凭 Telegram.WebApp 存在不足以判定 Mini App，需有非空 initData。
          if (window.Telegram && window.Telegram.WebApp) {
            markTelegramMiniApp(window.Telegram.WebApp.initData)
          }
        }
        initH5TelegramEnvironment()

        function hasTelegramWebApp() {
          return !!(window.Telegram && window.Telegram.WebApp)
        }

        function loadTelegramWebAppSdk() {
          if (!window.__H5_TG_MINI_APP__) {
            return
          }
          if (hasTelegramWebApp()) {
            initTelegramWebApp()
            return
          }
          if (window.__H5_TG_SDK_LOADING__) {
            return
          }

          window.__H5_TG_SDK_LOADING__ = true
          var script = document.createElement('script')
          script.id = 'telegram-web-app-sdk'
          script.src = 'https://telegram.org/js/telegram-web-app.js'
          script.async = true
          script.crossOrigin = 'anonymous'
          script.referrerPolicy = 'no-referrer'
          script.onload = function () {
            window.__H5_TG_SDK_LOADING__ = false
            initTelegramWebApp()
          }
          script.onerror = function () {
            window.__H5_TG_SDK_LOADING__ = false
            console.warn('[telegram] sdk load failed, continue without telegram bridge')
          }
          document.head.appendChild(script)
        }

        if (hasTelegramWebApp()) {
          // SDK 已在 head 中按 Telegram 官方要求优先加载，此处只初始化业务桥接。
          initTelegramWebApp()
        } else if (window.__H5_TG_MINI_APP__) {
          // Cocos Creator 预览依赖 window.onload 才启动 quick_compile，外部 async script
          // 在 load 前插入会推迟该事件——但仅预览（debug）需要迁就。正式包必须立即请求 SDK：
          // 等到 load 意味着要等整个 Cocos 引擎与资源加载完，全屏请求晚到好几秒，
          // 首次进入（缓存为空）便一直停在半屏 bottom sheet 里。
          var isCocosPreview = !!(window._CCSettings && window._CCSettings.debug)
          if (isCocosPreview && document.readyState !== 'complete') {
            window.addEventListener('load', loadTelegramWebAppSdk, { once: true })
          } else {
            loadTelegramWebAppSdk()
          }
        }
        bindCocosViewportResize()

        // 引擎脚本异步加载，轮询直到 cc.view 就绪后安装引擎 resize 键盘守卫
        var engineGuardTimer = window.setInterval(function () {
          if (guardCocosEngineResize()) {
            window.clearInterval(engineGuardTimer)
          }
        }, 250)
        window.setTimeout(function () {
          window.clearInterval(engineGuardTimer)
        }, 30000)
      })()
    </script>
    <script>
      ;(function () {
        function isIosStandalone() {
          var nav = window.navigator || {}
          var ua = String(nav.userAgent || '')
          var isIos = /iPad|iPhone|iPod/.test(ua)
            || (nav.platform === 'MacIntel' && Number(nav.maxTouchPoints) > 1)
          var isStandalone = nav.standalone === true
            || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          return isIos && isStandalone
        }

        if (!isIosStandalone()) {
          return
        }

        var retryCount = 0
        var timer = 0

        function getCanvasSize(canvas) {
          var rect = typeof canvas.getBoundingClientRect === 'function'
            ? canvas.getBoundingClientRect()
            : null
          var width = Math.round((rect && rect.width) || canvas.clientWidth || window.innerWidth || 0)
          var height = Math.round((rect && rect.height) || canvas.clientHeight || window.screen.height || window.innerHeight || 0)
          return { width: width, height: height }
        }

        function syncCocosFrameToCanvas() {
          var canvas = document.getElementById('GameCanvas')
          if (!canvas || !window.cc || !cc.view) {
            return false
          }

          var size = getCanvasSize(canvas)
          if (!size.width || !size.height) {
            return false
          }

          try {
            if (typeof cc.view.setFrameSize === 'function') {
              cc.view.setFrameSize(size.width, size.height)
            } else if (cc.view._frameSize) {
              cc.view._frameSize.width = size.width
              cc.view._frameSize.height = size.height
            }

            if (cc.Canvas && cc.Canvas.instance) {
              var design = cc.Canvas.instance.designResolution
              if (design && design.width && design.height) {
                var policy = size.width / size.height > 0.75
                  ? cc.ResolutionPolicy.FIXED_HEIGHT
                  : cc.ResolutionPolicy.FIXED_WIDTH
                cc.view.setDesignResolutionSize(design.width, design.height, policy)
              }
            }

            if (typeof cc.view.emit === 'function') {
              cc.view.emit('canvas-resize')
            }
            return true
          } catch (error) {
            return false
          }
        }

        function scheduleSync() {
          window.clearTimeout(timer)
          timer = window.setTimeout(function () {
            if (syncCocosFrameToCanvas()) {
              retryCount = 0
              return
            }
            retryCount += 1
            if (retryCount < 60) {
              scheduleSync()
            }
          }, 100)
        }

        window.addEventListener('load', scheduleSync, { passive: true })
        window.addEventListener('resize', scheduleSync, { passive: true })
        window.addEventListener('orientationchange', scheduleSync, { passive: true })
        document.addEventListener('visibilitychange', scheduleSync, { passive: true })
        if (window.visualViewport && window.visualViewport.addEventListener) {
          window.visualViewport.addEventListener('resize', scheduleSync, { passive: true })
        }

        scheduleSync()
        window.setTimeout(scheduleSync, 500)
        window.setTimeout(scheduleSync, 1500)
      })()
    </script>

    <!-- H5 独立入口：可被 Cocos 统一模板复用 -->
    <script type="module" src="/src/entry/cocos-h5-entry.ts"></script>
